# Difinity Echo - local development infrastructure (Milestone 0).
#
# DEVELOPMENT ONLY. Not a production, staging or customer deployment.
# Credentials come from infra/local/.env, generated by scripts/bootstrap.sh
# from .env.example with random values; .env is git-ignored.
#
# Image tags are pinned. They could not be pulled in the environment that
# authored this file (container registries were blocked by egress policy), so
# the first successful `scripts/bootstrap.sh` run should record image digests.
# See infra/local/README.md -> "Open decisions".
name: difinity-echo-local

services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:${ECHO_KAFKA_HOST_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by later milestones, never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${ECHO_KAFKA_HOST_PORT:-59092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: echo_local
      CLICKHOUSE_USER: ${ECHO_CLICKHOUSE_USER:?run scripts/bootstrap.sh to create infra/local/.env}
      CLICKHOUSE_PASSWORD: ${ECHO_CLICKHOUSE_PASSWORD:?run scripts/bootstrap.sh to create infra/local/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ports:
      - "127.0.0.1:${ECHO_CLICKHOUSE_HTTP_HOST_PORT:-58123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:8123/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: echo_control_plane
      POSTGRES_USER: ${ECHO_POSTGRES_USER:?run scripts/bootstrap.sh to create infra/local/.env}
      POSTGRES_PASSWORD: ${ECHO_POSTGRES_PASSWORD:?run scripts/bootstrap.sh to create infra/local/.env}
    ports:
      - "127.0.0.1:${ECHO_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d echo_control_plane']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  object-storage:
    # S3-compatible canonical-archive stand-in. See README: the choice of
    # S3-compatible implementation for local development is an open decision.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ECHO_OBJECT_STORAGE_ACCESS_KEY:?run scripts/bootstrap.sh to create infra/local/.env}
      MINIO_ROOT_PASSWORD: ${ECHO_OBJECT_STORAGE_SECRET_KEY:?run scripts/bootstrap.sh to create infra/local/.env}
    ports:
      - "127.0.0.1:${ECHO_OBJECT_STORAGE_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${ECHO_OBJECT_STORAGE_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  object-storage-data:
